<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Shrey's Calc - A state-of-the-art scientific calculator powered by Python with rich glassmorphism UI, trigonometric, logarithmic, and power functions.">
    <title>Shrey's Calc - Modern Scientific Calculator</title>
    <!-- Modern Typography from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- Background Ambient Glow Spheres -->
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>
    <div class="ambient-glow glow-3"></div>

    <main class="app-layout">
        <!-- Main Calculator Card -->
        <section class="calculator-card" id="calculator-app" aria-label="Shrey's Calc">
            <!-- App Header / Toolbar -->
            <header class="calc-header">
                <div class="brand">
                    <div class="brand-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="4" y="2" width="16" height="20" rx="4"></rect>
                            <line x1="8" y1="6" x2="16" y2="6"></line>
                            <line x1="16" y1="14" x2="16" y2="18"></line>
                            <path d="M16 10h.01"></path>
                            <path d="M12 10h.01"></path>
                            <path d="M8 10h.01"></path>
                            <path d="M12 14h.01"></path>
                            <path d="M8 14h.01"></path>
                            <path d="M12 18h.01"></path>
                            <path d="M8 18h.01"></path>
                        </svg>
                    </div>
                    <div class="brand-text">
                        <span class="app-title">Shrey's Calc</span>
                        <span class="engine-badge" id="engine-status">
                            <span class="status-dot"></span> Python 3.11 &bull; Scientific
                        </span>
                    </div>
                </div>

                <div class="header-actions">
                    <!-- DEG / RAD Angle Mode Switcher -->
                    <button id="deg-rad-btn" class="pill-btn" title="Toggle Angle Mode (DEG/RAD)" aria-label="Toggle Angle Mode">
                        <span id="angle-mode-label">DEG</span>
                    </button>

                    <!-- Audio Click Toggle -->
                    <button id="sound-btn" class="icon-btn" title="Toggle Sound Feedback" aria-label="Toggle Sound Feedback">
                        <svg class="sound-on-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
                        </svg>
                    </button>

                    <!-- Theme Switcher -->
                    <div class="theme-selector-wrap">
                        <button id="theme-btn" class="icon-btn" title="Change Theme" aria-label="Change Theme">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="5"></circle>
                                <line x1="12" y1="1" x2="12" y2="3"></line>
                                <line x1="12" y1="21" x2="12" y2="23"></line>
                                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                                <line x1="1" y1="12" x2="3" y2="12"></line>
                                <line x1="21" y1="12" x2="23" y2="12"></line>
                                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                            </svg>
                        </button>
                    </div>

                    <!-- History Drawer Toggle -->
                    <button id="history-toggle-btn" class="icon-btn" title="Toggle History Log" aria-label="Toggle History Log">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12 6 12 12 16 14"></polyline>
                        </svg>
                    </button>
                </div>
            </header>

            <!-- Calculator Display Screen -->
            <div class="display-container">
                <div class="display-top">
                    <span id="expression-preview" class="expression-line" title="Current Calculation Expression"></span>
                    <button id="copy-btn" class="copy-btn" title="Copy result to clipboard" aria-label="Copy result">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                        </svg>
                        <span class="copy-text">Copy</span>
                    </button>
                </div>
                
                <div class="display-main">
                    <span id="main-display" class="main-number" tabindex="0" role="textbox" aria-readonly="true">0</span>
                </div>

                <div class="display-bottom">
                    <div class="mode-and-memory-badges">
                        <span id="angle-badge" class="badge-tag">DEG</span>
                        <span id="mem-indicator" class="mem-badge inactive">M: 0</span>
                    </div>
                    <span id="live-eval-preview" class="live-eval-line"></span>
                </div>
            </div>

            <!-- Memory and Mode Bar -->
            <div class="memory-bar">
                <button class="mem-btn" data-action="mc" id="btn-mc">MC</button>
                <button class="mem-btn" data-action="mr" id="btn-mr">MR</button>
                <button class="mem-btn" data-action="m-plus" id="btn-mplus">M+</button>
                <button class="mem-btn" data-action="m-minus" id="btn-mminus">M−</button>
                <button class="mem-btn scientific-toggle active" id="btn-sci-toggle" title="Toggle Scientific Operations">
                    <span>Sci</span>
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"></polyline></svg>
                </button>
            </div>

            <!-- Scientific Keyboard Section (Collapsible / Toggleable) -->
            <div class="scientific-panel open" id="sci-tray">
                <!-- Sci Row 1: Trig & Inverse Toggle -->
                <button class="btn-sci toggle-2nd" id="btn-2nd" title="Toggle 2nd Functions (sin⁻¹, cos⁻¹, tan⁻¹)">2nd</button>
                <button class="btn-sci trig-btn" data-fn="sin" id="btn-sin" title="Sine">sin</button>
                <button class="btn-sci trig-btn" data-fn="cos" id="btn-cos" title="Cosine">cos</button>
                <button class="btn-sci trig-btn" data-fn="tan" id="btn-tan" title="Tangent">tan</button>
                <button class="btn-sci" data-fn="ln" id="btn-ln" title="Natural Log (ln)">ln</button>

                <!-- Sci Row 2: Logs & Exponents -->
                <button class="btn-sci" data-fn="log" id="btn-log" title="Logarithm (base 10)">log</button>
                <button class="btn-sci" data-fn="exp" id="btn-exp" title="Exponential eˣ">eˣ</button>
                <button class="btn-sci" data-fn="sqr" id="btn-sqr" title="Square (x²)">x²</button>
                <button class="btn-sci" data-fn="cube" id="btn-cube" title="Cube (x³)">x³</button>
                <button class="btn-sci" data-fn="power" id="btn-pow" title="Power (xʸ)">xʸ</button>

                <!-- Sci Row 3: Roots & Inverses -->
                <button class="btn-sci" data-fn="sqrt" id="btn-sqrt" title="Square Root (√x)">√x</button>
                <button class="btn-sci" data-fn="cbrt" id="btn-cbrt" title="Cube Root (∛x)">∛x</button>
                <button class="btn-sci" data-fn="reciprocal" id="btn-recip" title="Reciprocal (1/x)">1/x</button>
                <button class="btn-sci" data-fn="abs" id="btn-abs" title="Absolute Value (|x|)">|x|</button>
                <button class="btn-sci" data-fn="fact" id="btn-fact" title="Factorial (n!)">n!</button>

                <!-- Sci Row 4: Constants & Grouping -->
                <button class="btn-sci" data-fn="pi" id="btn-pi" title="Pi Constant (π)">π</button>
                <button class="btn-sci" data-fn="e" id="btn-e" title="Euler's Constant (e)">e</button>
                <button class="btn-sci" data-fn="paren-open" id="btn-paren-open" title="Open Parenthesis">(</button>
                <button class="btn-sci" data-fn="paren-close" id="btn-paren-close" title="Close Parenthesis">)</button>
                <button class="btn-sci" data-fn="mod" id="btn-mod" title="Modulo (mod)">mod</button>
            </div>

            <!-- Standard Keypad Grid -->
            <div class="keypad-grid" role="group" aria-label="Calculator Keypad">
                <!-- Row 1 -->
                <button class="btn btn-special" data-action="clear" id="btn-clear" aria-label="All Clear">AC</button>
                <button class="btn btn-special" data-action="backspace" id="btn-backspace" aria-label="Backspace">⌫</button>
                <button class="btn btn-special" data-action="percent" id="btn-percent" aria-label="Percent">%</button>
                <button class="btn btn-operator" data-operator="÷" id="btn-divide" aria-label="Divide">÷</button>

                <!-- Row 2 -->
                <button class="btn btn-digit" data-digit="7" id="btn-7">7</button>
                <button class="btn btn-digit" data-digit="8" id="btn-8">8</button>
                <button class="btn btn-digit" data-digit="9" id="btn-9">9</button>
                <button class="btn btn-operator" data-operator="×" id="btn-multiply" aria-label="Multiply">×</button>

                <!-- Row 3 -->
                <button class="btn btn-digit" data-digit="4" id="btn-4">4</button>
                <button class="btn btn-digit" data-digit="5" id="btn-5">5</button>
                <button class="btn btn-digit" data-digit="6" id="btn-6">6</button>
                <button class="btn btn-operator" data-operator="-" id="btn-subtract" aria-label="Subtract">−</button>

                <!-- Row 4 -->
                <button class="btn btn-digit" data-digit="1" id="btn-1">1</button>
                <button class="btn btn-digit" data-digit="2" id="btn-2">2</button>
                <button class="btn btn-digit" data-digit="3" id="btn-3">3</button>
                <button class="btn btn-operator" data-operator="+" id="btn-add" aria-label="Add">+</button>

                <!-- Row 5 -->
                <button class="btn btn-digit" data-action="negate" id="btn-negate" aria-label="Negate">±</button>
                <button class="btn btn-digit" data-digit="0" id="btn-0">0</button>
                <button class="btn btn-digit" data-action="decimal" id="btn-decimal" aria-label="Decimal">.</button>
                <button class="btn btn-equals" data-action="calculate" id="btn-equals" aria-label="Calculate">=</button>
            </div>

            <!-- Footer / Keyboard hint -->
            <footer class="calc-footer">
                <span class="keyboard-hint">⌨️ Supports Keyboard: [0-9] [+-*/^] [Enter =] [Esc AC] [s sin] [c cos] [t tan] [l ln] [!]</span>
            </footer>
        </section>

        <!-- Slide-out History Panel -->
        <aside class="history-panel" id="history-panel" aria-label="Calculation History">
            <div class="history-header">
                <div class="history-title">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                    <span>Calculation History</span>
                </div>
                <div class="history-controls">
                    <button id="clear-history-btn" class="history-clear-btn" title="Clear All History">Clear</button>
                    <button id="close-history-btn" class="icon-btn" aria-label="Close History">✕</button>
                </div>
            </div>

            <div class="history-list" id="history-list">
                <div class="empty-history-message">
                    <span>No calculations yet</span>
                    <small>Your math will be saved here</small>
                </div>
            </div>
        </aside>
    </main>

    <!-- Floating Toast Notification -->
    <div id="toast" class="toast" role="alert" aria-live="polite"></div>

    <script src="/static/js/script.js"></script>
</body>
</html>
